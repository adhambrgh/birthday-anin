<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Anin!! - Main Game</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .page-game .card { --page-enter: pop-in; }
      #game-area {
        position: relative;
        width: 100%;
        height: 360px;
        background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
        border-radius: 18px;
        overflow: hidden;
        margin: 14px 0;
        box-shadow: inset 0 0 30px rgba(144,202,249,.4);
      }
      .game-cloud {
        position: absolute;
        background: rgba(255,255,255,.7);
        border-radius: 50%;
        animation: cloud-float linear infinite;
      }
      @keyframes cloud-float { from { transform: translateX(-120px); } to { transform: translateX(calc(100% + 120px)); } }
      .balloon {
        position: absolute;
        width: var(--size, 52px);
        height: calc(var(--size, 52px) * 1.25);
        border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
        cursor: pointer;
        transition: transform .08s ease-out;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,.18));
      }
      .balloon::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 22%;
        width: 22%;
        height: 28%;
        background: rgba(255,255,255,.55);
        border-radius: 50%;
        transform: rotate(-28deg);
      }
      .balloon::after {
        content: "";
        position: absolute;
        bottom: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 28px;
        background: linear-gradient(to bottom, currentColor, transparent);
      }
      .balloon.golden { background: linear-gradient(145deg, #ffd54f, #ffb300) !important; box-shadow: 0 0 18px 4px rgba(255,193,7,.5); }
      .balloon:hover { transform: scale(1.1); }
      .balloon:active { transform: scale(.9); }
      .score-float {
        position: absolute;
        font-family: "Pattaya", cursive;
        font-size: 1.6rem;
        font-weight: 700;
        pointer-events: none;
        animation: score-rise .9s ease-out forwards;
      }
      @keyframes score-rise { 0% { transform: translateY(0) scale(.8); opacity: 1; } 100% { transform: translateY(-60px) scale(1.1); opacity: 0; } }
      .combo-badge {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 14px;
        background: linear-gradient(135deg, #ec407a, #ff7043);
        color: #fff;
        font-weight: 700;
        border-radius: 999px;
        font-size: .85rem;
        opacity: 0;
        transition: opacity .2s;
      }
      .combo-badge.show { opacity: 1; animation: combo-pulse .4s ease-out; }
      @keyframes combo-pulse { 50% { transform: translateX(-50%) scale(1.15); } }
      .game-hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .game-hud span { font-weight: 700; color: #1565c0; }
      .score-shake { animation: shake .25s ease-out; }
      @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      .game-popup {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,.45);
        backdrop-filter: blur(3px);
      }
      .game-popup.show { display: flex; }
      .game-popup-content {
        background: #fff;
        padding: 32px 28px 24px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(21,101,192,.3);
        max-width: 360px;
        animation: popup-bounce .4s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      @keyframes popup-bounce { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .game-popup h2 { color: #ec407a; font-family: "Pattaya", cursive; font-size: 2rem; margin: 0 0 8px; }
      .game-popup .final-score { font-size: 3.2rem; font-weight: 700; color: #1565c0; margin: 10px 0; }
      .game-popup .final-msg { color: #424242; margin: 0 0 20px; font-size: 1.05em; }
      .game-popup-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .game-popup-actions button { margin: 0; }
    </style>
  </head>
  <body>
    <div class="bg-decor" id="bgDecor"></div>

    <svg style="display: none">
      <symbol id="bunga-rame" viewBox="0 0 100 100">
        <path d="M20,50 C10,40 10,20 30,15 C40,25 35,40 20,50 Z" fill="#A5D6A7" />
        <path d="M80,50 C90,60 90,80 70,85 C60,75 65,60 80,50 Z" fill="#A5D6A7" />
        <circle cx="50" cy="50" r="12" fill="#FDD835" />
        <ellipse cx="50" cy="25" rx="15" ry="20" fill="#BBDEFB" />
        <ellipse cx="50" cy="75" rx="15" ry="20" fill="#BBDEFB" />
        <ellipse cx="25" cy="50" rx="20" ry="15" fill="#BBDEFB" />
        <ellipse cx="75" cy="50" rx="20" ry="15" fill="#BBDEFB" />
        <ellipse cx="32" cy="32" rx="12" ry="12" fill="white" opacity="0.7" />
        <ellipse cx="68" cy="68" rx="12" ry="12" fill="white" opacity="0.7" />
        <ellipse cx="32" cy="68" rx="12" ry="12" fill="white" opacity="0.7" />
        <ellipse cx="68" cy="32" rx="12" ry="12" fill="white" opacity="0.7" />
      </symbol>
    </svg>

    <svg class="flower-corner flower-top-left">
      <use xlink:href="#bunga-rame" />
    </svg>
    <svg class="flower-corner flower-bottom-right">
      <use xlink:href="#bunga-rame" />
    </svg>

    <audio id="music" loop>
      <source src="audio/audio.mp3" type="audio/mpeg" />
    </audio>

    <button class="music-fab" id="music-btn" onclick="toggleMusic()" title="Putar lagu">
      <span class="fab-icon">♫</span>
    </button>

    <!-- ============ HALAMAN 7 : MINI GAME ============ -->
    <div class="page page-game active" id="page-game">
      <div class="card">
        <h3>Mini Game: Pecahkan Balon</h3>
        <p>Pecahkan balon sebanyak-banyaknya sebelum waktu habis!</p>

        <div class="game-hud">
          <div><span id="score">Skor: 0</span><span class="combo-badge" id="combo-badge">COMBO x2!</span></div>
          <span id="game-timer">Sisa: 20</span>
        </div>

        <div id="game-area"></div>
        <div id="game-clouds" aria-hidden="true"></div>

        <button class="btn-green" id="btn-start" onclick="startGame()">
          Mulai Game
        </button>
        <br />
        <button
          class="btn-blue"
          onclick="window.location.href='halaman-pin.html'"
          style="font-size: 15px; max-width: 200px"
        >
          Mulai Dari Awal
        </button>
      </div>

      <div class="game-popup" id="game-popup">
        <div class="game-popup-content">
          <h2>Waktu Habis!</h2>
          <div class="final-score" id="final-score">0</div>
          <p class="final-msg" id="final-msg">Not bad! Coba lagi yaa</p>
          <div class="game-popup-actions">
            <button class="btn-green" onclick="closePopup(); startGame();">Main Lagi</button>
            <button class="btn-blue" onclick="window.location.href='halaman-pin.html'">Kembali</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      // ===================== GAME BALON =====================
      let gameTimer = null;
      let balloonTimer = null;
      let timeLeft = 20;
      let score = 0;
      let playing = false;
      let combo = 0;
      let comboTimer = null;
      let multiplier = 1;

      const BALLOON_COLORS = ["#ef5350", "#f48fb1", "#66bb6a", "#81c784", "#42a5f5", "#64b5f6", "#ffca28", "#ffcc80", "#ab47bc", "#ce93d8", "#ff7043"];
      const BALLOON_SIZES = [44, 52, 62, 72];

      function createClouds() {
        const container = document.getElementById("game-clouds");
        for (let i = 0; i < 4; i++) {
          const c = document.createElement("div");
          c.className = "game-cloud";
          c.style.width = 60 + Math.random() * 60 + "px";
          c.style.height = 30 + Math.random() * 20 + "px";
          c.style.top = 10 + Math.random() * 80 + "px";
          c.style.animationDuration = 18 + Math.random() * 12 + "s";
          c.style.animationDelay = -Math.random() * 20 + "s";
          container.appendChild(c);
        }
      }

      function showScoreFloat(x, y, points) {
        const el = document.createElement("div");
        el.className = "score-float";
        el.innerText = "+" + points;
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.color = points > 1 ? "#ffca28" : "#ec407a";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }

      function checkCombo() {
        const badge = document.getElementById("combo-badge");
        if (combo >= 3) {
          multiplier = 2;
          badge.classList.add("show");
        }
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
          combo = 0;
          multiplier = 1;
          badge.classList.remove("show");
        }, 1500);
      }

      function spawnBalloon() {
        if (!playing) return;
        const area = document.getElementById("game-area");
        const areaW = area.clientWidth;
        const areaH = area.clientHeight;
        const b = document.createElement("div");
        const isGolden = Math.random() < 0.12;
        const size = BALLOON_SIZES[Math.floor(Math.random() * BALLOON_SIZES.length)];
        b.className = "balloon" + (isGolden ? " golden" : "");
        b.style.setProperty("--size", size + "px");
        const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
        b.style.background = isGolden ? "" : `linear-gradient(145deg, ${color}, ${color}dd)`;
        b.style.color = color;
        b.style.left = Math.random() * (areaW - size - 20) + "px";
        b.style.bottom = -(size * 1.3) + "px";
        const points = isGolden ? 3 : 1;
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!playing) return;
          combo++;
          checkCombo();
          const addScore = points * multiplier;
          score += addScore;
          const scoreEl = document.getElementById("score");
          scoreEl.innerText = "Skor: " + score;
          scoreEl.classList.remove("score-shake");
          void scoreEl.offsetWidth;
          scoreEl.classList.add("score-shake");
          showScoreFloat(e.clientX, e.clientY, addScore);
          sparkleDi(e.clientX - 10, e.clientY - 10);
          b.remove();
        });
        area.appendChild(b);
        let pos = -(size * 1.3);
        const speed = 1.8 + Math.random() * 1.5;
        const rise = setInterval(() => {
          pos += speed;
          if (pos > areaH + 50) {
            clearInterval(rise);
            b.remove();
          } else {
            b.style.bottom = pos + "px";
          }
        }, 20);
      }

      function startGame() {
        if (playing) return;
        playing = true;
        score = 0;
        timeLeft = 20;
        combo = 0;
        multiplier = 1;
        document.getElementById("score").innerText = "Skor: 0";
        document.getElementById("game-timer").innerText = "Sisa: " + timeLeft;
        document.getElementById("btn-start").innerText = "Sedang Bermain...";
        document.getElementById("game-area").innerHTML = "";

        balloonTimer = setInterval(() => {
          if (playing) spawnBalloon();
        }, 520);

        gameTimer = setInterval(() => {
          timeLeft--;
          document.getElementById("game-timer").innerText = "Sisa: " + timeLeft;
          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        playing = false;
        clearInterval(gameTimer);
        clearInterval(balloonTimer);
        document.getElementById("btn-start").innerText = "Main Lagi";
        document.getElementById("combo-badge").classList.remove("show");
        semprotConfetti(30);
        setTimeout(() => semprotConfetti(18), 350);
        const msg = score >= 25 ? "LEGENDARY! KAMU JAGO BANGET!" :
                    score >= 15 ? "WAH MABAHAYA, JAGO PECAHIN BALON!" :
                    score >= 8 ? "Seru banget! Bagus!" : "Not bad! Coba lagi yaa";
        document.getElementById("final-score").innerText = score;
        document.getElementById("final-msg").innerText = msg;
        document.getElementById("game-popup").classList.add("show");
      }

      function closePopup() {
        document.getElementById("game-popup").classList.remove("show");
      }

      function stopGame() {
        playing = false;
        clearInterval(gameTimer);
        clearInterval(balloonTimer);
        document.getElementById("btn-start").innerText = "Mulai Game";
      }

      createBgDecor();
      createClouds();
      semprotConfetti(35);
    </script>
  </body>
</html>
